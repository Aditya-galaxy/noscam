<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NoScam</title>
<style>
  :root { --fg: #000; --muted: #666; --line: #eaeaea; --wash: #fafafa; color-scheme: light; }
  body { width: 320px; margin: 0; background: #fff; color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: baseline; justify-content: space-between;
           padding: 14px 18px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header p { margin: 0; font-size: 12px; color: var(--muted); }
  main { padding: 16px 18px 18px; }
  .state { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);
           margin-bottom: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
  .dot.on { background: #000; }
  .dot.off { background: #fff; border: 1px solid #999; }
  .arrival { background: var(--wash); border: 1px solid var(--line); border-radius: 8px;
             padding: 12px 14px; margin: 0 0 14px; font-size: 13px; color: #444; }
  .row { display: flex; justify-content: space-between; align-items: baseline;
         padding: 9px 0; border-bottom: 1px solid var(--line); }
  .row:last-of-type { border-bottom: 0; }
  .row span { color: var(--muted); font-size: 13px; }
  .row b { font-weight: 600; }
  a.button { display: block; text-align: center; margin-top: 14px; padding: 12px;
             background: #000; color: #fff; text-decoration: none; border-radius: 8px;
             font-weight: 500; font-size: 14px; }
  .muted { color: #888; font-size: 12px; margin: 12px 0 0; }
  .update { display: block; margin: 0 0 14px; font-size: 13px; color: #000; }
</style>
</head>
<body>
<header>
  <h1>NoScam</h1>
  <p id="sub">checking…</p>
</header>
<main>
  <div class="state"><span class="dot" id="dot"></span><span id="status">connecting…</span></div>
  <div class="arrival" id="arrival">Working out how you reached this page…</div>
  <div id="limits"></div>
  <a class="button" href="http://127.0.0.1:8787/app/" target="_blank">Open on your phone</a>
  <p class="muted">Every decision is made on this computer. Nothing about your
    payments leaves it.</p>
</main>
<script src="popup.js"></script>
</body>
</html>
