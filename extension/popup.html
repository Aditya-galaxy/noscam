<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NoScam</title>
<style>
  :root { color-scheme: light; }
  body { width: 320px; margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
         color: #16202e; background: #f5f7fa; }
  header { background: #0b1220; color: #fff; padding: 14px 16px; }
  header h1 { margin: 0; font-size: 16px; }
  header p { margin: 3px 0 0; font-size: 12px; opacity: .75; }
  main { padding: 14px 16px 18px; }
  .state { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #9aa5b5; }
  .dot.on { background: #1c9e5a; }
  .dot.off { background: #c62828; }
  .row { display: flex; justify-content: space-between; padding: 7px 0;
         border-bottom: 1px solid #e4e9f0; }
  .row:last-of-type { border-bottom: 0; }
  .row span { color: #5c6a7d; }
  .arrival { background: #fff4d6; color: #8a5a00; padding: 10px 12px; border-radius: 8px;
             margin: 12px 0; font-size: 13px; }
  .arrival.clean { background: #e7f6ec; color: #1c6b3f; }
  a.button { display: block; text-align: center; margin-top: 12px; padding: 10px;
             background: #0b5cff; color: #fff; text-decoration: none; border-radius: 8px;
             font-weight: 600; }
  .muted { color: #7b8496; font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<header>
  <h1>NoScam</h1>
  <p id="sub">Checking…</p>
</header>
<main>
  <div class="state"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
  <div class="arrival" id="arrival">Working out how you reached this page…</div>
  <div id="limits"></div>
  <a class="button" href="http://127.0.0.1:8787/app/" target="_blank">Open on your phone</a>
  <p class="muted">Everything is decided on this computer. Nothing about your
    payments leaves it.</p>
</main>
<script src="popup.js"></script>
</body>
</html>
