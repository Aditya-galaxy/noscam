[project]
name = "noscam"
dynamic = ["version"]
description = "Refuses to let an instruction that arrived through a message authorise something irreversible."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aditya Kumar" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "httpx>=0.26",
    "cryptography>=42.0",
]

[project.optional-dependencies]
desktop = [
    "pystray>=0.19.5",
    "pillow>=10.0.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
# `pipx install .` then `noscam` — no repository, no terminal gymnastics.
noscam = "noscam:main"

[project.urls]
Source = "https://github.com/Aditya-galaxy/noscam"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["noscam"]
packages = ["service"]

[tool.setuptools.dynamic]
version = { attr = "service.__version__" }

# The phone app, the extension and the demo sites are not Python packages, so
# `package-data` cannot reach them. They are installed as data files under
# <prefix>/share/noscam, which is where service/paths.py looks for them.
[tool.setuptools.data-files]
"share/noscam/web" = ["web/*"]
"share/noscam/extension" = ["extension/*.js", "extension/*.json", "extension/*.html"]
"share/noscam/extension/icons" = ["extension/icons/*"]
"share/noscam/demo" = ["demo/*.py"]
"share/noscam/demo/bank" = ["demo/bank/*.html"]
"share/noscam/demo/bank/downloads" = ["demo/bank/downloads/*"]
"share/noscam/demo/messages" = ["demo/messages/*"]
