[project]
name = "noscam"
version = "1.0.0"
description = "Refuses to let an instruction that arrived through a message authorise something irreversible."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aditya Kumar" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "httpx>=0.26",
]

[project.scripts]
# `pipx install .` then `noscam` — no repository, no terminal gymnastics.
noscam = "noscam:main"

[project.urls]
Source = "https://github.com/Aditya-galaxy/noscam"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["noscam"]
packages = ["service"]

[tool.setuptools.package-data]
"*" = ["web/*", "demo/**/*", "extension/*", "eval/*"]
