<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Bank — Payments</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #f4f6f8; color: #1a2330; }
  header { background: #14532d; color: #fff; padding: 16px 24px; font-weight: 700; }
  main { max-width: 560px; margin: 32px auto; background: #fff; border-radius: 12px;
         padding: 28px; box-shadow: 0 2px 10px rgba(16,32,64,.08); }
  h1 { font-size: 21px; margin: 0 0 18px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; color: #44506a; }
  input, select { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid #cfd6e4;
                  border-radius: 8px; background: #fff; }
  button { margin-top: 24px; width: 100%; padding: 14px; font-size: 17px; font-weight: 600;
           color: #fff; background: #14532d; border: 0; border-radius: 8px; cursor: pointer; }
  .done { display: none; padding: 16px; border-radius: 8px; background: #e7f6ec;
          color: #1c5b34; margin-top: 20px; }
  .note { max-width: 560px; margin: 0 auto 40px; font-size: 13px; color: #6b7280; }
</style>
</head>
<body>
<header>Your Bank</header>

<main>
  <h1>Make a payment</h1>
  <form id="pay-form" data-noscam-action="payment">
    <label for="payee">Pay</label>
    <select id="payee" name="payee">
      <option>Landlord</option>
      <option>Electricity Board</option>
      <option>Rahul Verma</option>
    </select>

    <label for="amount">Amount (₹)</label>
    <input id="amount" name="amount" type="number" value="2000">

    <button type="submit">Pay</button>
  </form>
  <div class="done" id="done">Payment sent.</div>
</main>

<p class="note">
  <b>Demo.</b> The honest half: a bank page the person opened themselves, to show
  that ordinary payments are not obstructed.
</p>

<script>
  document.getElementById("pay-form").addEventListener("submit", (event) => {
    event.preventDefault();
    document.getElementById("done").style.display = "block";
  });
</script>
<script src="http://localhost:8792/content.js"></script>
</body>
</html>
