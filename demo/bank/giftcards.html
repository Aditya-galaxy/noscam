<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gift Cards — Instant Delivery</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #f7f7f9; color: #1a1a1f; }
  header { background: #232f3e; color: #fff; padding: 16px 24px; font-weight: 700; }
  main { max-width: 560px; margin: 32px auto; background: #fff; border-radius: 12px;
         padding: 28px; box-shadow: 0 2px 10px rgba(16,32,64,.08); }
  h1 { font-size: 21px; margin: 0 0 18px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; color: #44506a; }
  input, select { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid #cfd6e4;
                  border-radius: 8px; background: #fff; }
  button { margin-top: 24px; width: 100%; padding: 14px; font-size: 17px; font-weight: 600;
           color: #111; background: #ffd814; border: 0; border-radius: 8px; cursor: pointer; }
  .done { display: none; padding: 16px; border-radius: 8px; background: #e7f6ec;
          color: #1c5b34; margin-top: 20px; }
  .note { max-width: 560px; margin: 0 auto 40px; font-size: 13px; color: #6b7280; }
</style>
</head>
<body>
<header>Gift Cards · Instant Delivery</header>
<main>
  <h1>Buy a gift card</h1>
  <form id="gift-form" data-noscam-action="payment">
    <label for="brand">Card</label>
    <select id="brand" name="brand">
      <option>Amazon Gift Card</option>
      <option>Google Play gift card</option>
      <option>Apple Gift Card</option>
    </select>

    <label for="amount">Amount (₹)</label>
    <input id="amount" name="amount" type="number" value="5000">

    <label for="email">Send the codes to</label>
    <input id="email" name="email" value="support.refund.team@mail.example">

    <button type="submit">Buy gift card</button>
  </form>
  <div class="done" id="done">Gift card purchased. Codes sent.</div>
</main>
<p class="note"><b>Demo.</b> A stand-in for the gift-card page a scam sends people
  to. Nothing is bought and no code is sent.</p>
<script>
  document.getElementById("gift-form").addEventListener("submit", (event) => {
    event.preventDefault();
    document.getElementById("done").style.display = "block";
  });
</script>
<script src="http://localhost:8792/content.js"></script>
</body>
</html>
