<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Pay</title>
<style>
  body { margin: 0; font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #f4f6f8; color: #1a2330; }
  header { background: #4a148c; color: #fff; padding: 16px 24px; font-weight: 700; }
  main { max-width: 520px; margin: 32px auto; background: #fff; border-radius: 12px;
         padding: 28px; box-shadow: 0 2px 10px rgba(16,32,64,.08); }
  label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; color: #44506a; }
  input { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid #cfd6e4;
          border-radius: 8px; }
  button { margin-top: 24px; width: 100%; padding: 14px; font-size: 17px; font-weight: 600;
           color: #fff; background: #4a148c; border: 0; border-radius: 8px; cursor: pointer; }
  .done { display: none; padding: 16px; border-radius: 8px; background: #e7f6ec;
          color: #1c5b34; margin-top: 20px; }
  .note { max-width: 520px; margin: 0 auto 40px; font-size: 13px; color: #6b7280; }
</style>
</head>
<body>
<header>Quick Pay</header>
<main>
  <h1 style="font-size:21px;margin:0 0 6px">Send money</h1>
  <p style="color:#6b7280;margin:0 0 10px">No form, no submit event — this page posts
    with fetch(), the way most real payment pages do.</p>

  <label for="payee">Send to</label>
  <input id="payee" name="payee" value="Rahul Verma">

  <label for="amount">Amount (₹)</label>
  <input id="amount" name="amount" type="number" value="18000">

  <button id="pay" type="button">Pay now</button>
  <div class="done" id="done">Payment sent.</div>
</main>
<p class="note"><b>Demo.</b> Proves the gate does not depend on a form submit.
  Nothing is sent anywhere.</p>
<script>
  document.getElementById("pay").addEventListener("click", async () => {
    // A real page would POST here. If NoScam only listened for form submits,
    // this would already be gone.
    document.getElementById("done").style.display = "block";
  });
</script>
<script src="http://localhost:8792/content.js"></script>
</body>
</html>
