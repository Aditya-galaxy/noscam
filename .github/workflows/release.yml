name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python eval/score.py

  package-extension-and-source:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build source bundle and extension zip
        run: python package.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-bundles
          path: dist/*

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pillow pystray
      - name: Build macOS App
        run: python scripts/build_desktop.py
      - name: Archive macOS App
        run: |
          cd dist
          zip -r NoScam-macOS.zip NoScam.app
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: noscam-macos
          path: dist/NoScam-macOS.zip

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pillow pystray
      - name: Build Windows Executable
        run: python scripts/build_desktop.py
      - name: Archive Windows Application
        run: |
          Compress-Archive -Path dist/NoScam -DestinationPath dist/NoScam-Windows.zip
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: noscam-windows
          path: dist/NoScam-Windows.zip

  publish-release:
    needs: [package-extension-and-source, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
