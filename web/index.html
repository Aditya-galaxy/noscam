<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<link rel="manifest" href="manifest.webmanifest">
<title>NoScam</title>
<style>
  /* Monochrome, glass, rigid. The colour of a decision is never a hue here —
     it is weight and contrast — because a red banner is the one thing every
     scam page already imitates. */
  :root {
    color-scheme: dark;
    --ink: #08080a; --panel: rgba(22, 22, 26, .72); --line: rgba(255,255,255,.14);
    --text: #f4f4f5; --dim: #a1a1aa; --faint: #71717a; --paper: #ffffff;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--ink); color: var(--text); font: 17px/1.5 var(--sans);
    background-image:
      radial-gradient(60vw 40vh at 80% -10%, rgba(255,255,255,.10), transparent 70%),
      radial-gradient(50vw 35vh at 0% 5%, rgba(255,255,255,.06), transparent 70%),
      linear-gradient(transparent 95%, rgba(255,255,255,.035) 95%),
      linear-gradient(90deg, transparent 95%, rgba(255,255,255,.035) 95%);
    background-size: auto, auto, 32px 32px, 32px 32px;
    background-attachment: fixed;
    min-height: 100vh;
  }
  header { padding: 22px 20px 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: .34em;
              text-transform: uppercase; }
  header p { margin: 8px 0 0; font: 11px/1 var(--mono); letter-spacing: .18em;
             text-transform: uppercase; color: var(--dim); }
  nav { display: flex; border-bottom: 1px solid var(--line); position: sticky; top: 0;
        z-index: 5; background: rgba(8,8,10,.72); backdrop-filter: blur(20px) saturate(140%);
        -webkit-backdrop-filter: blur(20px) saturate(140%); }
  nav button { flex: 1; padding: 15px 8px; font: 600 11px/1 var(--mono); letter-spacing: .16em;
               text-transform: uppercase; background: none; border: 0;
               border-bottom: 2px solid transparent; color: var(--faint); cursor: pointer; }
  nav button[aria-selected="true"] { color: var(--paper); border-bottom-color: var(--paper); }
  main { padding: 18px 16px 64px; max-width: 560px; margin: 0 auto; }
  section[hidden] { display: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
          backdrop-filter: blur(26px) saturate(140%);
          -webkit-backdrop-filter: blur(26px) saturate(140%);
          box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 24px 60px rgba(0,0,0,.45);
          margin-bottom: 14px; overflow: hidden; }
  .card .bar { display: flex; justify-content: space-between; padding: 11px 18px;
               border-bottom: 1px solid var(--line); font: 600 10px/1 var(--mono);
               letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
  .card .body { padding: 20px 18px; }
  .card h2 { font-size: 21px; line-height: 1.2; letter-spacing: -.01em; margin: 0 0 8px; }
  .card p { margin: 0 0 10px; color: #d4d4d8; }
  .meta { font: 11px/1.6 var(--mono); letter-spacing: .09em; text-transform: uppercase;
          color: var(--faint); }
  .row { display: flex; gap: 10px; margin-top: 18px; }
  button.action { flex: 1; font: 600 13px/1 var(--sans); letter-spacing: .08em;
                  text-transform: uppercase; padding: 15px 12px; border-radius: 2px;
                  border: 1px solid transparent; cursor: pointer; }
  .approve { background: var(--paper); color: #09090b; }
  .deny { background: transparent; color: var(--text); border-color: rgba(255,255,255,.34); }
  .empty { text-align: center; color: var(--faint); padding: 56px 20px; border: 1px dashed var(--line);
           border-radius: 4px; }
  .empty strong { display: block; font: 600 12px/1 var(--mono); letter-spacing: .2em;
                  text-transform: uppercase; color: var(--text); margin-bottom: 10px; }
  label { display: block; font: 600 10px/1 var(--mono); letter-spacing: .18em;
          text-transform: uppercase; margin: 16px 0 8px; color: var(--dim); }
  input { width: 100%; padding: 14px; font: 16px/1.4 var(--mono); color: var(--text);
          background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 2px; }
  input:focus { outline: none; border-color: rgba(255,255,255,.55); }
  .verdict { border: 1px solid var(--line); border-left-width: 3px; border-radius: 2px;
             padding: 16px; margin-top: 18px; background: rgba(0,0,0,.28); }
  .verdict.dangerous { border-left-color: var(--paper); }
  .verdict.suspicious { border-left-color: rgba(255,255,255,.55); }
  .verdict.no_signals { border-left-color: rgba(255,255,255,.22); }
  .verdict h3 { margin: 0 0 10px; font: 600 12px/1 var(--mono); letter-spacing: .2em;
                text-transform: uppercase; }
  .signals { margin: 0; padding-left: 18px; }
  .signals li { margin-bottom: 8px; font-size: 15px; color: #d4d4d8; }
  .chain { font: 11px/1.6 var(--mono); color: var(--faint); margin-top: 12px;
           word-break: break-all; }
  .limit { display: flex; justify-content: space-between; align-items: baseline;
           padding: 13px 0; border-bottom: 1px solid var(--line); }
  .limit:last-of-type { border-bottom: 0; }
  .limit span { font: 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
                color: var(--dim); }
  .limit b { font: 17px/1 var(--mono); }
  .save { width: 100%; margin-top: 20px; background: var(--paper); color: #09090b; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 26px;
           background: rgba(255,255,255,.96); color: #09090b; padding: 12px 20px;
           border-radius: 2px; font: 600 11px/1 var(--mono); letter-spacing: .16em;
           text-transform: uppercase; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>NoScam</h1>
  <p id="household-line">connecting</p>
</header>

<nav role="tablist">
  <button role="tab" aria-selected="true" data-tab="approvals">Approvals</button>
  <button role="tab" aria-selected="false" data-tab="link">Check a link</button>
  <button role="tab" aria-selected="false" data-tab="limits">Limits</button>
</nav>

<main>
  <section id="tab-approvals">
    <div id="approvals"></div>
  </section>

  <section id="tab-link" hidden>
    <div class="card">
      <div class="bar"><span>Link check</span><span>address only</span></div>
      <div class="body">
        <h2>Is this link safe?</h2>
        <p class="meta">Nothing is opened on your phone. The check runs on your own computer.</p>
        <label for="url">Paste the link</label>
        <input id="url" type="url" inputmode="url" placeholder="https://…"
               autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="row"><button class="action approve" id="check">Check it</button></div>
        <div id="verdict"></div>
      </div>
    </div>
  </section>

  <section id="tab-limits" hidden>
    <div class="card">
      <div class="bar"><span>Household limits</span><span id="spent-badge">—</span></div>
      <div class="body">
        <div class="limit"><span>One payment up to</span><b id="l-per">—</b></div>
        <div class="limit"><span>All payments per day</span><b id="l-day">—</b></div>
        <div class="limit"><span>Spent today</span><b id="l-spent">—</b></div>
        <div class="limit"><span>New payee waits</span><b id="l-cool">—</b></div>
        <div class="limit"><span>Remote control</span><b id="l-remote">—</b></div>
        <label for="per">One payment up to</label>
        <input id="per" type="number" inputmode="numeric">
        <label for="day">All payments per day</label>
        <input id="day" type="number" inputmode="numeric">
        <label for="guardian">Who gets asked</label>
        <input id="guardian" type="text" autocomplete="off">
        <button class="action save" id="save">Save limits</button>
      </div>
    </div>
    <div class="card">
      <div class="bar"><span>Reported sites</span><span>blocked for everyone</span></div>
      <div class="body"><p class="meta" id="reported">none yet</p></div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
